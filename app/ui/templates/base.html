<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReleaseGuard{% endblock %}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        nav form { display: inline; margin-left: 15px; }
        nav button { border: 0; background: transparent; color: #007bff; cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f5f5f5; }
        .flash { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .btn { padding: 5px 10px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="color: inherit; text-decoration: none;">ReleaseGuard</a></h1>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/projects">Projects</a>
            <a href="/requirements">Requirements</a>
            <a href="/traceability">Traceability</a>
            <a href="/audit">Audit</a>
            <a href="/admin/users">Users</a>
            <a href="/login">Login</a>
            <form method="post" action="/logout">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
